name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Guards the failure that took production down: a runtime dependency that is
  # installed in someone's local venv but missing from backend/requirements.txt.
  # The container installs ONLY requirements.txt, so if the app cannot be imported
  # from that file alone, uvicorn cannot boot and the deploy crashes on startup.
  clean-import:
    name: Clean-import check (requirements.txt alone must boot the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Must match the Dockerfile's python:3.12-slim base image.
          python-version: '3.12'

      - name: Create an isolated virtualenv
        # No --system-site-packages: the runner's preinstalled packages must not
        # be able to mask a dependency missing from requirements.txt.
        run: python -m venv .ci-clean

      - name: Install ONLY backend/requirements.txt
        run: |
          .ci-clean/bin/python -m pip install --upgrade pip
          .ci-clean/bin/python -m pip install -r backend/requirements.txt

      - name: Import the app exactly as uvicorn does
        # Deliberately no DATABASE_URL and no .env: database.py must fall back to
        # sqlite at import time, as it does in a cold container.
        run: |
          .ci-clean/bin/python - <<'PY'
          import sys, traceback
          try:
              from backend.app.main import app
          except Exception:
              traceback.print_exc()
              print(
                  "\n::error::Could not import backend.app.main from requirements.txt alone.\n"
                  "A module the app imports at runtime is missing from backend/requirements.txt.\n"
                  "Add it (pinned) or the next deploy will crash on startup.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"OK: imported backend.app.main -> {app.title}")
          PY

  tests:
    name: Tests (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run the mocked suite
        # The `live` tests hit the real Base44 gateway and spend credits; they are
        # deselected here and skip themselves anyway without BASE44_* secrets.
        run: python -m pytest -m "not live" -q

  # Guards the 2D flow view the same way the two jobs above guard the backend. Worth its own
  # job because the defects this catches are invisible to a typecheck: the two bugs found when
  # the view was built (a hover race that wiped the highlight, and overlapping cards that stole
  # each other's pointer events) both compiled fine and both broke the interaction.
  frontend:
    name: Frontend (typecheck, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        # `ci`, not `install`: it fails on a lockfile that disagrees with package.json rather
        # than silently resolving something different from what was developed against.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Without a backend every browser test skips itself, and the job reports green having
      # tested nothing. LLM_PROVIDER=stub answers the same schemas mechanically, so the full
      # path - intake, simulation, decision prompts - runs offline and without spending credits.
      - name: Set up Python for the API
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: .
        run: python -m pip install -r backend/requirements.txt

      - name: Start the API with the stub provider
        working-directory: .
        env:
          LLM_PROVIDER: stub
          # The usage caps protect a deployment's credits; here they would only throttle the
          # suite. The browser tests start more simulations than one client is allowed per day
          # (RUNS_PER_CLIENT_DAILY defaults to 5), and every test arrives from the same
          # 127.0.0.1 — so the sixth run would be refused and the job would fail on a guard
          # doing exactly its job. The stub spends nothing, so there is nothing to protect.
          LLM_DAILY_CALL_CAP: '0'
          RUNS_PER_CLIENT_DAILY: '0'
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (echo "API failed to start" && exit 1)

      - name: Install Chromium
        # Only the browser the suite uses. --with-deps pulls the system libraries the runner
        # lacks; without it Chromium installs and then fails to launch.
        run: npx playwright install --with-deps chromium

      # Split by spec on purpose. GitHub requires authentication to read job LOGS, but step
      # names and their pass/fail are public — so running each suite as its own step means a
      # failure says WHICH suite broke without anyone having to hold a token. Diagnosing a red
      # CI run should not depend on privileged access.
      #
      # playwright.config.ts starts Vite itself, and CI=true stops it reusing a server that
      # is not there.
      - name: Browser tests - 2D flow view
        run: npx playwright test flow.spec

      - name: Browser tests - live path (intake, simulation, decisions)
        if: always()
        run: npx playwright test live.spec

      - name: Browser tests - 3D build model
        if: always()
        run: npx playwright test view3d.spec

      # Naming specs individually buys legible failures but costs this: a new spec file runs
      # nowhere until it is listed. playback.spec was invisible to CI until this line existed.
      - name: Browser tests - playback controls (play, pause, step, replay)
        if: always()
        run: npx playwright test playback.spec

      - name: Browser tests - decision point reachability
        if: always()
        run: npx playwright test decision-visibility.spec

      - name: Browser tests - 4D time scrubber
        if: always()
        run: npx playwright test scrubber.spec

      - name: Upload rendered screenshots
        # Always, not just on failure: these are how the rendered flow gets reviewed without
        # anyone opening a browser, which is the point of capturing them at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: frontend/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/e2e/.artifacts/
            frontend/playwright-report/
          retention-days: 7
