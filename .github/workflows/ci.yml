name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Guards the failure that took production down: a runtime dependency that is
  # installed in someone's local venv but missing from backend/requirements.txt.
  # The container installs ONLY requirements.txt, so if the app cannot be imported
  # from that file alone, uvicorn cannot boot and the deploy crashes on startup.
  clean-import:
    name: Clean-import check (requirements.txt alone must boot the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Must match the Dockerfile's python:3.12-slim base image.
          python-version: '3.12'

      - name: Create an isolated virtualenv
        # No --system-site-packages: the runner's preinstalled packages must not
        # be able to mask a dependency missing from requirements.txt.
        run: python -m venv .ci-clean

      - name: Install ONLY backend/requirements.txt
        run: |
          .ci-clean/bin/python -m pip install --upgrade pip
          .ci-clean/bin/python -m pip install -r backend/requirements.txt

      - name: Import the app exactly as uvicorn does
        # Deliberately no DATABASE_URL and no .env: database.py must fall back to
        # sqlite at import time, as it does in a cold container.
        run: |
          .ci-clean/bin/python - <<'PY'
          import sys, traceback
          try:
              from backend.app.main import app
          except Exception:
              traceback.print_exc()
              print(
                  "\n::error::Could not import backend.app.main from requirements.txt alone.\n"
                  "A module the app imports at runtime is missing from backend/requirements.txt.\n"
                  "Add it (pinned) or the next deploy will crash on startup.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"OK: imported backend.app.main -> {app.title}")
          PY

  tests:
    name: Tests (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requirements-dev.txt carries the third-party XER parser the P6 round-trip test reads
        # our own export back with. It is GPL-3.0 and test-only, so it is kept out of
        # requirements.txt and out of the image the Dockerfile builds.
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt

      - name: Run the mocked suite
        # test_event_loop_responsive.py starts a real uvicorn and times /health while a stage
        # reasons, so it needs a few seconds of wall clock and a free port. It is in the normal
        # suite deliberately: the bug it guards was invisible to every other test because the
        # stub answers instantly, and only a slow provider exposes it.
        # The `live` tests hit the real Base44 gateway and spend credits; they are
        # deselected here and skip themselves anyway without BASE44_* secrets.
        #
        # Failures are echoed as ::error:: annotations, the way the Playwright steps already do
        # it. GitHub requires authentication to read job LOGS but annotations are public, and
        # the backend job was the one place a red run said nothing but "exit code 1" - which
        # cost a full round trip of guessing on a failure that reproduced on no local machine.
        # Diagnosing CI should not depend on privileged access.
        run: |
          set -o pipefail
          python -m pytest -m "not live" -q --tb=short 2>&1 | tee pytest-output.txt && exit 0
          status=$?
          echo "::error::Backend suite failed. Failing tests:"
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          # The FAILURES section, not the tail: `-q` puts tracebacks above the warnings
          # summary, so a plain tail returns forty lines of DeprecationWarning and none of the
          # assertion. sed prints from the FAILURES banner to the short summary.
          sed -n '/=== FAILURES ===/,/short test summary/p' pytest-output.txt             | head -n 80 | sed 's/^/::notice::/'
          exit $status

  # Guards the 2D flow view the same way the two jobs above guard the backend. Worth its own
  # job because the defects this catches are invisible to a typecheck: the two bugs found when
  # the view was built (a hover race that wiped the highlight, and overlapping cards that stole
  # each other's pointer events) both compiled fine and both broke the interaction.
  frontend:
    name: Frontend (typecheck, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        # `ci`, not `install`: it fails on a lockfile that disagrees with package.json rather
        # than silently resolving something different from what was developed against.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Every browser spec on its own runner, in parallel.
  #
  # These ran as nineteen sequential steps in the job above, which was right about one thing and
  # wrong about the cost. The right part: one step per spec means a failure names the spec in
  # public step titles, and GitHub requires a token to read job LOGS - diagnosing a red build
  # should not depend on privileged access. A matrix keeps that exactly, because each leg is
  # named too.
  #
  # The cost it was paying: every spec drives a complete thirteen-stage simulation from intake,
  # so the specs are minutes each and nineteen of them in series ran past twenty minutes. That is
  # long enough to change how often anyone pushes, and this session has already spent three CI
  # cycles chasing failures that a faster loop would have surfaced one at a time.
  #
  # In parallel the wall clock is the slowest single spec, about four minutes. It costs more
  # runner-minutes - each leg installs its own dependencies - which is the trade being made
  # deliberately: runner minutes are cheap and the feedback loop is not.
  browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    strategy:
      # Every leg reports. `fail-fast: true` would cancel the others on the first red and hide
      # whether one spec broke or all of them did, which is the difference between a flake and a
      # regression.
      fail-fast: false
      matrix:
        include:
          - spec: flow.spec
            name: "2D flow view"
          - spec: live.spec
            name: "live path (intake, simulation, decisions)"
          - spec: view3d.spec
            name: "3D build model"
          - spec: playback.spec
            name: "playback controls (play, pause, step, replay)"
          - spec: decision-visibility.spec
            name: "decision point reachability"
          - spec: scrubber.spec
            name: "4D time scrubber"
          - spec: linked-hover.spec
            name: "linked hover (2D <-> 3D)"
          - spec: live-3d.spec
            name: "progressive 3D build during a live run"
          - spec: viewport.spec
            name: "canvas pan and zoom after completion"
          - spec: export.spec
            name: "P6 export download"
          - spec: zoom-scale.spec
            name: "one graph at every zoom, and a derived zoom floor"
          - spec: run-state.spec
            name: "open forks are one fact, not two"
          - spec: run-recovery.spec
            name: "a halted run is recoverable by URL"
          - spec: decision-desync.spec
            name: "answering fast never orphans the decision card"
          - spec: stream-drop.spec
            name: "a dropped stream never leaves a run stuck"
          - spec: reattach-race.spec
            name: "reattaching lands on the server's state"
          - spec: unplanned-stages.spec
            name: "an incomplete plan says so"
          - spec: zone-lanes.spec
            name: "a campus of halls stays readable"
          - spec: intake-upload.spec
            name: "document upload, and refusing one out loud"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Set up Python for the API
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: .
        run: python -m pip install -r backend/requirements.txt

      # Without a backend every browser test skips itself and reports green having tested
      # nothing. LLM_PROVIDER=stub answers the same schemas mechanically, so the full path runs
      # offline and spends no credits.
      - name: Start the API with the stub provider
        working-directory: .
        env:
          LLM_PROVIDER: stub
          # The usage caps protect a deployment's credits; here they would only throttle the
          # suite. Every test arrives from the same 127.0.0.1, so the sixth run of the day would
          # be refused and the job would fail on a guard doing exactly its job.
          LLM_DAILY_CALL_CAP: '0'
          RUNS_PER_CLIENT_DAILY: '0'
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (echo "API failed to start" && exit 1)

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: ${{ matrix.name }}
        run: npx playwright test ${{ matrix.spec }}

      # Artifact names must be unique across a matrix, or the upload fails on the second leg.
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.spec }}
          path: frontend/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.spec }}
          path: |
            frontend/e2e/.artifacts/
            frontend/playwright-report/
          retention-days: 7
